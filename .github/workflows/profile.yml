# Rebuild the profile image every day: trophy ranks and the latest kindric release.
name: profile

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      # Personal token (scopes repo, read:user): private work counts. Only this step sees it.
      - run: python tools/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - run: python tools/make_profile.py assets/profile.svg assets/trophies.svg
      - name: Commit only if the image changed
        run: |
          if [ -z "$(git status --porcelain assets/profile.svg assets/trophies.svg tools/stats.json)" ]; then
            echo "profile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg assets/trophies.svg tools/stats.json
          git commit -m "Update profile stats"
          git push
